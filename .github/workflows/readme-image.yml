name: Update README image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-image-main
  cancel-in-progress: true

jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install rendering tools
        run: |
          # Restrict APT to Ubuntu sources so unrelated third-party feeds
          # cannot block installation.
          test -s /etc/apt/sources.list.d/ubuntu.sources
          apt_options=(
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
            -o Dir::Etc::sourceparts=-
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --no-install-recommends -y texlive-latex-extra texlive-pictures poppler-utils

      - name: Check trees and regenerate the README image
        run: python3 terminaltrees-tests/check.py --update-readme-image

      - name: Commit the image if it changed
        run: |
          if git diff --quiet -- examples/comparison.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- examples/comparison.svg
          git commit -m 'Regenerate README image'
          # A normal push rejects this render if main advanced during the build.
          git push origin HEAD:main
